<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regalo para persona especial</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #EFDFB9;
    --paper-dark: #E4CE9C;
    --ink: #2E2013;
    --wine: #7A1F2B;
    --wine-dark: #591620;
    --gold: #B8912F;
    --shadow: rgba(26,20,12,0.35);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at top, #3a2a1f 0%, #1a120b 70%);
    font-family:'EB Garamond', serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 32px 16px;
  }

  /* ---------- decorative flourish ---------- */
  .flourish{
    width:70px; height:14px; margin: 10px auto;
    opacity:0.7;
  }
  .flourish svg{ width:100%; height:100%; }

  /* ================= PORTADA ================= */
  .cover{
    width:min(430px, 92vw);
    aspect-ratio: 3/4.3;
    background:
      linear-gradient(160deg, var(--wine) 0%, var(--wine-dark) 100%);
    border-radius: 6px;
    box-shadow: 0 30px 60px var(--shadow), 0 0 0 1px rgba(184,145,47,0.4);
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 40px 30px;
    text-align:center;
    cursor:pointer;
    border: 8px double rgba(184,145,47,0.55);
  }
  .cover::before{
    content:"";
    position:absolute; inset:14px;
    border: 1px solid rgba(184,145,47,0.35);
    border-radius:2px;
    pointer-events:none;
  }
  .cover h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    color: var(--paper);
    font-size: clamp(28px, 6vw, 40px);
    margin: 6px 0;
    letter-spacing: 0.5px;
    line-height:1.15;
  }
  .cover .subtitle{
    color: rgba(239,223,185,0.8);
    font-style: italic;
    font-size: 16px;
    margin-bottom: 18px;
  }
  .cover .note{
    color: rgba(239,223,185,0.75);
    font-size: 14px;
    max-width: 280px;
    line-height:1.5;
  }

  .seal{
    width:76px; height:76px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #C79A3A, var(--gold) 55%, #7d5e18 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(255,255,255,0.15);
    margin-bottom: 18px;
    transition: transform .25s ease;
  }
  .cover:hover .seal{ transform: scale(1.06) rotate(-3deg); }
  .seal svg{ width:36px; height:36px; }

  .tap-hint{
    margin-top: 22px;
    font-family:'Special Elite', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(239,223,185,0.55);
  }

  /* ================= ÍNDICE ================= */
  .book{
    width:min(920px, 96vw);
    background: var(--paper);
    border-radius: 8px;
    box-shadow: 0 30px 70px var(--shadow);
    display:flex;
    min-height: 78vh;
    overflow:hidden;
    border: 1px solid rgba(0,0,0,0.15);
  }

  .spine-index{
    width: 96px;
    flex-shrink:0;
    background: linear-gradient(180deg, var(--wine), var(--wine-dark));
    display:flex; flex-direction:column;
    align-items:center;
    padding: 18px 0;
    gap: 4px;
    overflow-y:auto;
  }
  .spine-index::-webkit-scrollbar{ width:0; }

  .tab{
    width: 62px; height: 34px;
    border-radius: 4px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Special Elite', monospace;
    font-size: 12px;
    color: rgba(239,223,185,0.55);
    background: rgba(0,0,0,0.15);
    cursor:default;
    position:relative;
    flex-shrink:0;
  }
  .tab.unlocked{
    background: var(--gold);
    color: #3a2a10;
    cursor:pointer;
    font-weight:bold;
  }
  .tab.today{
    box-shadow: 0 0 0 2px var(--paper), 0 0 12px 2px rgba(184,145,47,0.9);
  }
  .tab.active{
    background: var(--paper);
    color: var(--wine-dark);
  }

  .pages{
    flex:1;
    padding: clamp(20px, 4vw, 56px);
    overflow-y:auto;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0 2px, transparent 2px 4px),
      var(--paper);
  }

  .pages-header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid rgba(122,31,43,0.25);
    padding-bottom: 10px; margin-bottom: 22px;
  }
  .pages-header h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    color: var(--wine-dark);
    font-size: clamp(20px, 3vw, 26px);
    margin:0;
  }
  .pages-header .count{
    font-family:'Special Elite', monospace;
    font-size: 12px;
    color: var(--gold);
    letter-spacing:1px;
  }

  .intro-copy{
    font-style: italic;
    color:#5a4426;
    font-size: 15px;
    line-height:1.7;
    max-width: 46ch;
  }

  .grid-days{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(64px,1fr));
    gap: 10px;
    margin-top: 24px;
  }
  .day-chip{
    aspect-ratio:1;
    border-radius: 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Special Elite', monospace;
    background: rgba(122,31,43,0.06);
    border: 1px solid rgba(122,31,43,0.15);
    color:#8a7350;
    font-size:12px;
    position:relative;
  }
  .day-chip.unlocked{
    cursor:pointer;
    background: rgba(184,145,47,0.15);
    border-color: var(--gold);
    color: var(--wine-dark);
  }
  .day-chip.unlocked:hover{ background: rgba(184,145,47,0.3); }
  .day-chip .num{ font-size:16px; font-weight:bold; }
  .day-chip .lock{ font-size:14px; opacity:0.6; }

  /* ================= CAPÍTULO ================= */
  .chapter-eyebrow{
    font-family:'Special Elite', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .chapter-title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(26px, 4vw, 36px);
    color: var(--wine-dark);
    margin: 4px 0 18px 0;
  }
  .chapter-photo{
    width: 100%;
    max-width: 420px;
    aspect-ratio: 4/3;
    border-radius: 4px;
    object-fit: cover;
    box-shadow: 0 12px 26px rgba(0,0,0,0.2);
    border: 6px solid #fff;
    margin: 4px 0 26px 0;
    transform: rotate(-1.2deg);
  }
  .chapter-photo-fallback{
    width: 100%;
    max-width: 420px;
    aspect-ratio: 4/3;
    border-radius: 4px;
    box-shadow: 0 12px 26px rgba(0,0,0,0.2);
    border: 6px solid #fff;
    margin: 4px 0 26px 0;
    transform: rotate(-1.2deg);
    background: linear-gradient(135deg, #d8c491, #c7ab6d);
    display:flex; align-items:center; justify-content:center;
  }
  .chapter-photo-fallback svg{ width: 54px; height:54px; opacity:0.55; }

  .frase{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(19px, 2.6vw, 24px);
    color: var(--wine);
    line-height: 1.5;
    max-width: 52ch;
    margin: 0 0 22px 0;
  }
  .frase::before{ content:"“"; }
  .frase::after{ content:"”"; }

  .recuerdo{
    font-size: 16px;
    line-height: 1.75;
    color: #3a2c19;
    max-width: 58ch;
  }

  .chapter-footer{
    margin-top: 32px;
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .nav-btn{
    font-family:'Special Elite', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    background: none;
    border: 1px solid var(--wine);
    color: var(--wine);
    padding: 9px 16px;
    border-radius: 3px;
    cursor:pointer;
    text-transform: uppercase;
  }
  .nav-btn:hover{ background: var(--wine); color: var(--paper); }
  .nav-btn:disabled{ opacity:0.35; cursor:default; background:none; color: var(--wine); }

  /* locked view */
  .locked-msg{
    display:flex; flex-direction:column; align-items:flex-start;
    gap: 10px;
  }
  .locked-msg .big-lock{ font-size: 34px; opacity:0.5; }
  .locked-msg p{ max-width: 44ch; line-height:1.6; color:#5a4426; }

  @media (max-width: 720px){
    .book{ flex-direction:column; min-height:auto; }
    .spine-index{
      width:100%; flex-direction:row; overflow-x:auto; overflow-y:visible;
      padding: 12px;
    }
    .tab{ width:44px; height:30px; font-size:11px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<script>

/* ============================================================================
   No toques Wee lo dañas :v
   ============================================================================ */

function getToday(){
  const params = new URLSearchParams(window.location.search);
  const preview = params.get('preview');
  if(preview){
    const d = new Date(preview + "T00:00:00");
    if(!isNaN(d)) return d;
  }
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

function toDate(str){
  return new Date(str + "T00:00:00");
}

const today = getToday();

function isUnlocked(cap){
  return today >= toDate(cap.fecha);
}
function isToday(cap){
  return today.getTime() === toDate(cap.fecha).getTime();
}

const fallbackHeart = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 21s-7.5-4.9-10.1-9.3C.3 8.6 1.7 5 5.2 4.2c2-.5 4 .3 5 2 1-1.7 3-2.5 5-2 3.5.8 4.9 4.4 3.3 7.5C19.5 16.1 12 21 12 21z" stroke="#7A1F2B" stroke-width="1.4" fill="rgba(122,31,43,0.15)"/>
</svg>`;

let state = { view:'cover', chapterIndex:null };

function render(){
  const stage = document.getElementById('stage');
  if(state.view === 'cover'){
    stage.innerHTML = coverHTML();
    document.getElementById('open-book').onclick = ()=>{ state.view='index'; render(); };
  } else if(state.view === 'index'){
    stage.innerHTML = indexHTML();
    bindIndexEvents();
  } else if(state.view === 'chapter'){
    stage.innerHTML = chapterHTML(state.chapterIndex);
    bindChapterEvents();
  }
}

function coverHTML(){
  return `
  <div class="cover" id="open-book">
    <div class="seal"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21s-7.5-4.9-10.1-9.3C.3 8.6 1.7 5 5.2 4.2c2-.5 4 .3 5 2 1-1.7 3-2.5 5-2 3.5.8 4.9 4.4 3.3 7.5C19.5 16.1 12 21 12 21z" fill="#1a120b"/>
    </svg></div>
    <h1>${CONFIG.bookTitle}</h1>
    <div class="subtitle">${CONFIG.subtitle}</div>
    <div class="flourish">${flourishSVG()}</div>
    <p class="note">${CONFIG.coverNote}</p>
    <div class="tap-hint">Toca para abrir</div>
  </div>`;
}

function flourishSVG(){
  return `<svg viewBox="0 0 70 14"><path d="M0 7 H26 M44 7 H70 M35 2 L38 7 L35 12 L32 7 Z" stroke="#B8912F" stroke-width="1" fill="#B8912F"/></svg>`;
}

function indexHTML(){
  const unlockedCount = capitulos.filter(isUnlocked).length;
  const tabs = capitulos.map((cap, i)=>{
    const cls = ['tab'];
    if(isUnlocked(cap)) cls.push('unlocked');
    if(isToday(cap)) cls.push('today');
    return `<div class="${cls.join(' ')}" data-i="${i}">${String(cap.dia).padStart(2,'0')}</div>`;
  }).join('');

  const chips = capitulos.map((cap,i)=>{
    if(isUnlocked(cap)){
      return `<div class="day-chip unlocked" data-i="${i}">
        <div class="num">${cap.dia}</div>
        <div style="font-size:10px;">leer</div>
      </div>`;
    } else {
      const d = toDate(cap.fecha);
      const label = d.toLocaleDateString('es-ES', {day:'numeric', month:'short'});
      return `<div class="day-chip">
        <div class="num">${cap.dia}</div>
        <div class="lock">🔒 ${label}</div>
      </div>`;
    }
  }).join('');

  return `
  <div class="book">
    <div class="spine-index">${tabs}</div>
    <div class="pages">
      <div class="pages-header">
        <h2>Índice</h2>
        <div class="count">${unlockedCount} / 30 abiertos</div>
      </div>
      <p class="intro-copy">Cada día se abre un capítulo nuevo, solo el que le toca a la fecha de hoy :D.</p>
      <div class="grid-days">${chips}</div>
    </div>
  </div>`;
}

function bindIndexEvents(){
  document.querySelectorAll('[data-i]').forEach(el=>{
    const i = Number(el.dataset.i);
    if(isUnlocked(capitulos[i])){
      el.addEventListener('click', ()=>{
        state.view='chapter'; state.chapterIndex=i; render();
      });
    }
  });
}

function chapterHTML(i){
  const cap = capitulos[i];
  const unlocked = isUnlocked(cap);
  const dateLabel = toDate(cap.fecha).toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});

  const prevIdx = i>0 ? i-1 : null;
  const nextIdx = i<capitulos.length-1 ? i+1 : null;
  const prevEnabled = prevIdx!==null && isUnlocked(capitulos[prevIdx]);
  const nextEnabled = nextIdx!==null && isUnlocked(capitulos[nextIdx]);

  let body;
  if(unlocked){
    const photoBlock = cap.foto
      ? `<img class="chapter-photo" src="${cap.foto}" alt="Recuerdo del día ${cap.dia}"
           onerror="this.outerHTML='<div class=&quot;chapter-photo-fallback&quot;>${fallbackHeart.replace(/"/g,'&quot;')}</div>'">`
      : `<div class="chapter-photo-fallback">${fallbackHeart}</div>`;

    body = `
      <div class="chapter-eyebrow">Día ${String(cap.dia).padStart(2,'0')} · ${dateLabel}</div>
      <div class="chapter-title">${cap.titulo}</div>
      ${photoBlock}
      <p class="frase">${cap.frase}</p>
      <p class="recuerdo">${cap.recuerdo}</p>
    `;
  } else {
    body = `
      <div class="chapter-eyebrow">Día ${String(cap.dia).padStart(2,'0')} · ${dateLabel}</div>
      <div class="locked-msg">
        <div class="big-lock">🔒</div>
        <p>Este capítulo todavía no se abre. Vuelve el ${dateLabel} para leerlo.</p>
      </div>
    `;
  }

  return `
  <div class="book">
    <div class="spine-index">${capitulos.map((c,idx)=>{
      const cls=['tab'];
      if(isUnlocked(c)) cls.push('unlocked');
      if(isToday(c)) cls.push('today');
      if(idx===i) cls.push('active');
      return `<div class="${cls.join(' ')}" data-i="${idx}">${String(c.dia).padStart(2,'0')}</div>`;
    }).join('')}</div>
    <div class="pages">
      ${body}
      <div class="chapter-footer">
        <button class="nav-btn" id="btn-index">Índice</button>
        <button class="nav-btn" id="btn-prev" ${prevEnabled?'':'disabled'}>← Anterior</button>
        <button class="nav-btn" id="btn-next" ${nextEnabled?'':'disabled'}>Siguiente →</button>
      </div>
    </div>
  </div>`;
}

function bindChapterEvents(){
  document.getElementById('btn-index').onclick = ()=>{ state.view='index'; render(); };
  const prev = document.getElementById('btn-prev');
  const next = document.getElementById('btn-next');
  if(prev && !prev.disabled) prev.onclick = ()=>{ state.chapterIndex--; render(); };
  if(next && !next.disabled) next.onclick = ()=>{ state.chapterIndex++; render(); };

  document.querySelectorAll('.spine-index [data-i]').forEach(el=>{
    const idx = Number(el.dataset.i);
    if(isUnlocked(capitulos[idx])){
      el.addEventListener('click', ()=>{ state.chapterIndex = idx; render(); });
    }
  });
}

render();
</script>
</body>
</html>
